<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Lost at Sea</title>
  <style>
    /* Dark Mode Theme */
    body {
      font-family: Arial, sans-serif;
      background-color: #181818;
      color: white;
      text-align: center;
      padding: 40px;
      margin: 0;
    }

    /* Header Bar */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #101010;
      padding: 10px 20px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);
    }

    .logo {
      height: 40px;
    }

    .nav {
      display: flex;
      gap: 20px;
    }

    .nav a {
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 5px;
      background-color: #1d9bf0;
      transition: background-color 0.3s ease;
    }

    .nav a:hover {
      background-color: #1278c0;
    }

    /* 404 Page Content */
    .container {
      max-width: 600px;
      margin: auto;
      margin-top: 80px;
    }

    h1 {
      font-size: 3rem;
    }

    p {
      font-size: 1.4rem;
    }

    .wave {
      font-size: 4rem;
      color: #1d9bf0;
    }

    /* Animated Button */
    .home-button {
      display: inline-block;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffffff;
      background-color: #1d9bf0;
      padding: 12px 24px;
      border-radius: 8px;
      margin-top: 20px;
      transition: all 0.3s ease;
    }

    .home-button:hover {
      background-color: #1278c0;
      transform: scale(1.1);
    }

  </style>
</head>
<body>

  <!-- Header Bar -->
  <div class="header">
    <img src="https://consurf.github.io/CSurfLogoOnBlack.png" alt="ConSurf Logo" class="logo">
    <div class="nav">
      <a href="index.html">Home</a>
      <a href="team.html">Team Members</a>
    </div>
  </div>

  <!-- 404 Content -->
  <div class="container">
    <h1>404 - Lost at Sea</h1>
    <p>Looks like this wave took you somewhere unexpected...</p>
    <p class="wave">🌊</p>
    <p>Let’s head back to shore:</p>
    <a href="index.html" class="home-button">Return Home</a>
  </div>

</body>
</html>
