<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ConSurf News</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #181818;
      color: white;
      text-align: center;
      padding: 40px;
      margin: 0;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #101010;
      padding: 10px 20px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);
    }

    .logo {
      height: 40px;
    }

    .nav {
      display: flex;
      gap: 20px;
    }

    .nav a {
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 5px;
      background-color: #1d9bf0;
      transition: background-color 0.3s ease;
    }

    .nav a:hover {
      background-color: #1278c0;
    }

    .container {
      max-width: 700px;
      margin: auto;
      margin-top: 40px;
    }

    .news-item {
      background-color: #202020;
      padding: 20px;
      margin-bottom: 30px;
      border-radius: 10px;
      box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.3);
      text-align: left;
    }

    .news-item h2 {
      color: #1d9bf0;
      margin-bottom: 10px;
    }

    .news-item p {
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .date {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- Header Bar -->
  <div class="header">
    <img src="https://consurf.github.io/CSurfLogoOnBlack.png" alt="ConSurf Logo" class="logo">
    <div class="nav">
      <a href="index.html">Home</a>
      <a href="team.html">Team Members</a>
    </div>
  </div>

  <!-- News Section -->
  <div class="container">
    <h1>ConSurf News</h1>
    <div id="news-container"></div>
  </div>

  <script>
    fetch('news.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('news-container');
        data.news.forEach(item => {
          const div = document.createElement('div');
          div.className = 'news-item';
          div.innerHTML = `
            <div class="date">${item.date}</div>
            <h2>${item.title}</h2>
            <p>${item.content}</p>
          `;
          container.appendChild(div);
        });
      })
      .catch(error => {
        document.getElementById('news-container').innerHTML = '<p>Failed to load news. Please try again later.</p>';
        console.error('Error loading news:', error);
      });
  </script>

</body>
</html>
