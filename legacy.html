<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ConSurf Legacy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #111;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: 600;
      margin-bottom: 20px;
      opacity: 0.9;
    }

    #urlBar {
      width: 60%;
      max-width: 600px;
      padding: 14px 18px;
      border-radius: 32px;
      border: none;
      background-color: #222;
      color: #eee;
      font-size: 16px;
      box-shadow: 0 0 0 1px #444;
    }

    #urlBar:focus {
      outline: none;
      box-shadow: 0 0 0 2px #666;
    }

    #goBtn {
      margin-top: 20px;
      padding: 12px 26px;
      font-size: 16px;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      background: #444;
      color: white;
      transition: background 0.2s;
    }

    #goBtn:hover {
      background: #555;
    }

    .note {
      margin-top: 30px;
      font-size: 14px;
      opacity: 0.6;
      max-width: 500px;
      line-height: 1.4;
    }

    footer {
      position: absolute;
      bottom: 12px;
      font-size: 12px;
      opacity: 0.4;
    }
  </style>
</head>
<body>

  <div class="logo">ConSurf (Legacy Mode)</div>

  <input id="urlBar" type="text" placeholder="Enter URL or Search…" />
  <button id="goBtn">Go</button>

  <footer>ConSurf</footer>

  <script>
    // URL or Search Handler
    function handleInput() {
      const input = document.getElementById("urlBar").value.trim();
      if (!input) return;

      const isURL = /^(https?:\/\/)/i.test(input) || /\./.test(input);

      if (isURL) {
        const finalURL = input.startsWith("http") ? input : "https://" + input;
        window.location.href = finalURL;
      } else {
        window.location.href =
          "https://duckduckgo.com/?q=" + encodeURIComponent(input);
      }
    }

    document.getElementById("goBtn").onclick = handleInput;
    document.getElementById("urlBar").addEventListener("keydown", e => {
      if (e.key === "Enter") handleInput();
    });
  </script>

</body>
</html>
