<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ConSurf New Tab</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .logo {
      font-size: 48px;
      font-weight: 600;
      margin-bottom: 24px;
      color: #f0f0f0;
    }

    .search-container {
      width: 600px;
      max-width: 90%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="text"] {
      padding: 14px 18px;
      border-radius: 32px;
      border: none;
      background-color: #2a2a2a;
      color: #f0f0f0;
      font-size: 16px;
      box-shadow: 0 0 0 1px #444;
    }

    input[type="text"]:focus {
      outline: none;
      box-shadow: 0 0 0 2px #666;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 24px;
      background-color: #2a2a2a;
      color: #f0f0f0;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 0 0 1px #444;
    }

    button:hover {
      background-color: #3a3a3a;
    }

    .theme-select {
      margin-top: 24px;
      background-color: #2a2a2a;
      color: #f0f0f0;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px;
    }

    .footer {
      position: absolute;
      bottom: 12px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="logo">ConSurf</div>

  <div class="search-container">
    <input id="urlBar" type="text" placeholder="Enter URL and press Enter" />
    <input id="searchBar" type="text" placeholder="Search the web..." />
  </div>

  <script>
    document.getElementById("urlBar").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        let url = this.value.trim();
        if (!url.startsWith("http")) {
          url = "https://" + url;
        }
        window.location.href = url;
      }
    });

    document.getElementById("searchBar").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        const query = encodeURIComponent(this.value.trim());
        window.location.href = "https://duckduckgo.com/?q=" + query;
      }
    });

    function switchTheme(theme) {
      const body = document.body;
      if (theme === "light") {
        body.style.backgroundColor = "#ffffff";
        body.style.color = "#000000";
      } else if (theme === "retro") {
        body.style.backgroundColor = "#000000";
        body.style.color = "#00ff00";
        document.querySelectorAll("input, button, select").forEach(el => {
          el.style.backgroundColor = "#111";
          el.style.color = "#00ff00";
          el.style.border = "1px solid #00ff00";
        });
      } else {
        location.reload(); // reset to default
      }
    }
  </script>
</body>
</html>
